name: أميال باي — CI

# يشغّل: فحص بنيوي سريع → اختبارات الباكند الكاملة (747) → تحليل/اختبار Flutter
# → التحقّق من بناء صورة Docker. أي فشل يوقف الدمج.

# ══════════════════════════════════════════════════════════════════════
# AMIAL-PROD-READINESS-001 — **المرشِّحُ يغطّي كلَّ فرع، لأنّ كلَّ فرعٍ يُنشَر.**
#
# كان `[main, develop]` — **ولا وجودَ لأيٍّ منهما على origin**. الفرعان
# الوحيدان `claude/project-development-continuation-7oxhip` و
# `claude/project-code-review-yjagv`، وأحدُهما هو ما ينشره Coolify.
#
# فلم تُطلَق هذه البوّابةُ مرّةً واحدةً على شيفرةٍ دُفعت، **وخضرةُ المستودع
# كانت خضرةَ صمتٍ لا خضرةَ نجاح**.
#
# و`'**'` لا اسمٌ بعينه: أسماءُ فروع هذا المشروع تتولّد آليّاً وتتغيّر،
# فمرشِّحٌ بأسماءَ محفوظةٍ يعود إلى العطل نفسِه مع أوّل فرعٍ جديد.
# الحارس: `tests/Feature/DeploymentGateGuardTest.php`.
# ══════════════════════════════════════════════════════════════════════
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 1) فحص بنيوي سريع — لا يعتمد على عدّ الأقواس النصّي
  # ──────────────────────────────────────────────────────────
  structural:
    name: فحص بنيوي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # عدّ الأقواس النصّي لا يفهم heredoc أو regex أو المصفوفات المركبة
      # في PHP، فيعطي إنذارات كاذبة. php -l هو محلّل اللغة الحقيقي.
      - name: تثبيت PHP للفحص النحوي
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: فحص PHP وكشف تعارضات الدمج
        run: |
          ! rg -n '^(<<<<<<<|=======|>>>>>>>)' --glob '*.php' --glob '*.dart' .
          find 01_backend/app 01_backend/tests 01_backend/routes 01_backend/database \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  # ──────────────────────────────────────────────────────────
  # 2) اختبارات الباكند الكاملة (PHPUnit) — القلب
  # ──────────────────────────────────────────────────────────
  backend:
    name: اختبارات الباكند (PHPUnit)
    runs-on: ubuntu-latest
    needs: structural
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: amial_pay_testing
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: amial_pay_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - name: تثبيت PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, intl, exif, pcntl
          coverage: none

      - name: كاش Composer
        uses: actions/cache@v4
        with:
          path: 01_backend/vendor
          key: composer-${{ hashFiles('01_backend/composer.lock') }}

      - name: تثبيت الحزم
        working-directory: 01_backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: تجهيز البيئة + المفاتيح
        working-directory: 01_backend
        run: |
          cp .env.example .env
          # AMIAL-PROD-READINESS-002 — **git لا يتتبّع مجلّداً فارغاً.**
          #
          # `storage/` كلُّه مُتجاهَلٌ في .gitignore، فلا يوجد في نسخة CI.
          # و`passport:keys` يكتب فيه مباشرةً فيسقط:
          #
          #   file_put_contents(…/storage/oauth-public.key):
          #   Failed to open stream: No such file or directory
          #
          # ولا يظهر محلّيّاً: المجلّدُ قائمٌ على جهاز التطوير منذ أوّل تشغيل.
          mkdir -p storage/framework/{cache/data,sessions,views} \
                   storage/logs storage/app/public bootstrap/cache
          php artisan key:generate
          # مفاتيح Passport (إلزامية لاختبارات المصادقة الـ16)
          php artisan passport:keys --force
          # مفاتيح تشفير PII (إلزامية للإقلاع)
          echo "AMIAL_PII_ENCRYPTION_KEY=$(php -r 'echo base64_encode(random_bytes(32));')" >> .env
          echo "AMIAL_PII_BLIND_INDEX_KEY=$(php -r 'echo base64_encode(random_bytes(32));')" >> .env

      - name: تشغيل كل الاختبارات (747)
        working-directory: 01_backend
        run: |
          # لا نُغرق سجل Actions بالمخرجات المكررة؛ عند الفشل نعرض خاتمة
          # التقرير التي تحتوي أسماء الاختبارات والاستثناءات الفعلية.
          php artisan test > phpunit_report.txt 2>&1 || {
            echo '::error::فشلت اختبارات PHPUnit — آخر 160 سطراً:'
            tail -n 160 phpunit_report.txt
            exit 1
          }
          tail -n 20 phpunit_report.txt

  # ──────────────────────────────────────────────────────────
  # 3) تحليل واختبار تطبيق Flutter
  # ──────────────────────────────────────────────────────────
  flutter:
    name: Flutter (تحليل + اختبار)
    runs-on: ubuntu-latest
    needs: structural
    defaults:
      run:
        working-directory: 02_flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # ══════════════════════════════════════════════════════════
      # AMIAL-PROD-READINESS-002 — **عتبةٌ واحدةٌ لثلاث بوّابات.**
      #
      # كانت هنا `flutter analyze` مجرّدة، فتسقط على أيّ ملاحظةٍ أسلوبيّة:
      #
      #   133 issues found.  →  exit 1
      #   (صفر خطأ · ١٣ تحذير · ١٢٠ ملاحظة)
      #
      # و`codemagic.yaml` — **وهو الذي يبني التطبيقَ الذي يُشحَن فعلاً** —
      # و`scripts/verify.sh` كلاهما يعدّ `error •` وحدَها ويطبع الباقيَ
      # غيرَ مانع، بسببٍ مكتوبٍ فيهما: «لا نعتمد على رمز خروج
      # flutter analyze: دلالته تختلف بين الإصدارات».
      #
      # **فـCI كان الشاذَّ من الثلاثة**، لا الأشدَّ: يمنع دمجاً يبني
      # codemagic نسخته بلا شكوى. وثلاثُ عتباتٍ لثلاث بوّاباتٍ تُنتج
      # «أخضرُ هنا وأحمرُ هناك» — وهو ما يُعلَّم النظرُ عنه.
      #
      # والتحذيراتُ الـ١٣٣ **تُطبَع ولا تُخفى** — دَينٌ معلومٌ يُسدَّد، لا
      # عطلٌ يمنع الشحن.
      # ══════════════════════════════════════════════════════════
      - name: تحليل (0 أخطاء تصريف)
        working-directory: 02_flutter_app
        run: |
          flutter analyze --no-pub > analyze_report.txt 2>&1 || true

          ERRORS=$(grep -E '^[[:space:]]*error •' analyze_report.txt | grep -v '• build/' || true)

          echo "تحذيرات (غير مانعة): $(grep -cE '^[[:space:]]*warning •' analyze_report.txt || true)"
          echo "ملاحظات أسلوبية    : $(grep -cE '^[[:space:]]*info •'    analyze_report.txt || true)"

          if [ -n "$ERRORS" ]; then
            echo "::error::أخطاءُ تصريفٍ في Dart — البناءُ سيسقط في codemagic:"
            echo "$ERRORS"
            exit 1
          fi
          echo "✓ صفر خطأ تصريف"
      - name: اختبارات الواجهة
        run: flutter test

  # ──────────────────────────────────────────────────────────
  # 4) التحقّق من بناء الصورتين (بلا تشغيل)
  #
  # AMIAL-PROD-READINESS-001 — **الصورةُ المفحوصةُ هي الصورةُ المشحونة.**
  #
  # كانت تُبنى `Dockerfile.prod` وحدَها، و`DEPLOY_COOLIFY.md` يقول
  # «Build Pack = Dockerfile». فما يُفحَص غيرُ ما يُنشَر.
  #
  # وقد كلّف هذا عطلاً بنصّه من قبل: إصلاحُ مجلّدات PDF كُتب في
  # `entrypoint.prod.sh` وحدَه — «وهذا الملفّ هو المُستعمَل فعلاً، فلم
  # يكن يصل» (تعليقٌ في `docker/entrypoint.sh` نفسِه).
  # ──────────────────────────────────────────────────────────
  docker:
    name: بناء صورتَي Docker
    runs-on: ubuntu-latest
    needs: structural
    strategy:
      fail-fast: false
      matrix:
        # الأولى هي المنشورةُ اليوم، والثانيةُ هي المشدَّدة.
        dockerfile: [Dockerfile, Dockerfile.prod]
    steps:
      - uses: actions/checkout@v4
      - name: بناء ${{ matrix.dockerfile }}
        working-directory: 01_backend
        run: docker build -f ${{ matrix.dockerfile }} -t amial-pay:ci-${{ matrix.dockerfile }} .

  # ──────────────────────────────────────────────────────────
  # AMIAL-CD-TRIGGER-001 — **الدفعُ لا ينشر، وهذا آخرُ بابٍ مغلق.**
  #
  # **الثمنُ الذي دُفع، بنصّ صاحب المشروع:** «منذ أيّامٍ وأنا لم أستطع
  # عملَ بناءٍ للتطبيق أو نشرَ المشروع».
  #
  # Coolify على `Source: Manual` في كلّ نشراته — فالدفعُ إلى الفرع
  # المنشور لا يُطلق شيئاً، وكلُّ ما في المستودع يقف حتّى يفتح إنسانٌ
  # البابَ بيده. **وبابٌ يُفتَح باليد يُنسى**، فتبقى الشيفرةُ الجديدةُ
  # في git والقديمةُ تخدم العملاء، ولا سطرَ يقول ذلك.
  #
  # **ولا يُضبَط Coolify من مستودع** — هو لوحةٌ خارجيّة. لكنّه يقبل
  # خطّافَ نشرٍ بعنوانٍ واحد. فيُوضَع العنوانُ سرّاً واحداً، ويصير
  # النشرُ تلقائيّاً إلى الأبد:
  #
  #     Coolify ← المشروع ← Webhooks ← انسخ «Deploy Webhook»
  #     GitHub  ← Settings ← Secrets ← New secret
  #                 الاسم : COOLIFY_DEPLOY_HOOK
  #
  # ══════════════════════════════════════════════════════════
  # **وثلاثةُ حدودٍ مقصودةٌ تُقرأ ولا تُخمَّن:**
  #
  # ① **بعد البوّابة لا معها** (`needs`) — نشرٌ يسبق الفحصَ يشحن ما
  #    لم يُفحَص، وهو أسوأ من نشرٍ يدويّ.
  #
  # ② **فرعُ النشر وحدَه.** Coolify يستورد
  #    `claude/project-code-review-yjagv`؛ وخطّافٌ يُطلَق من كلّ فرعٍ
  #    ينشر شيفرةً ليست هي المقصودة.
  #
  # ③ **وغيابُ السرّ ليس فشلاً.** الخطوةُ تُخطَّى وتقول لماذا — فوظيفةٌ
  #    حمراءُ على إعدادٍ لم يُضبَط بعد تُعوّد القارئَ على تجاهل الأحمر.
  #    (وهي القاعدةُ السابعة: «غيرُ معروف» ليس فشلاً، ويُقال بسببه.)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: إطلاق نشرة Coolify
    runs-on: ubuntu-latest
    needs: [structural, backend, flutter, docker]
    if: github.ref == 'refs/heads/claude/project-code-review-yjagv'
    steps:
      - name: نداء خطّاف النشر
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice title=النشر التلقائي غير مضبوط::" \
              "السرُّ COOLIFY_DEPLOY_HOOK غيرُ موجود، فالنشرُ ما زال يدويّاً." \
              "اضبطه مرّةً واحدةً: Coolify ← Webhooks ← Deploy Webhook،" \
              "ثمّ GitHub ← Settings ← Secrets ← COOLIFY_DEPLOY_HOOK."
            exit 0
          fi

          # `--fail-with-body` لا `--fail` وحدَها: ٤٠٤ على خطّافٍ خاطئ
          # يجب أن يُظهر نصَّ الردّ، وإلّا صار «فشل» بلا سبب.
          code=$(curl -sS --fail-with-body -o /tmp/hook.out -w '%{http_code}' \
                   --max-time 60 -X GET "$HOOK") || {
            echo "::error title=تعذّر إطلاق النشرة::$(head -c 400 /tmp/hook.out)"
            exit 1
          }

          echo "::notice title=أُطلقت النشرة::ردّ Coolify $code على ${GITHUB_SHA::7}"
          head -c 400 /tmp/hook.out || true

      # **وإطلاقُ النشرة ليس نجاحَها.** Coolify يردّ فورَ القبول، والبناءُ
      # يجري بعده دقائق. فيُقال ذلك صراحةً لئلّا تُقرأ الخضرةُ «نُشر».
      - name: ما بعد الإطلاق
        run: |
          echo "::notice title=الخطوة التالية::" \
            "الإطلاقُ ليس اكتمالاً — تابِع Coolify حتّى Running (healthy)،" \
            "ثمّ شغّل: php artisan amial:readiness --base=https://amialpay.com"
