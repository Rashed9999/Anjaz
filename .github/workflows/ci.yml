name: أميال باي — CI

# يشغّل: فحص بنيوي سريع → اختبارات الباكند الكاملة (747) → تحليل/اختبار Flutter
# → التحقّق من بناء صورة Docker. أي فشل يوقف الدمج.

# ══════════════════════════════════════════════════════════════════════
# AMIAL-PROD-READINESS-001 — **المرشِّحُ يغطّي كلَّ فرع، لأنّ كلَّ فرعٍ يُنشَر.**
#
# كان `[main, develop]` — **ولا وجودَ لأيٍّ منهما على origin**. الفرعان
# الوحيدان `claude/project-development-continuation-7oxhip` و
# `claude/project-code-review-yjagv`، وأحدُهما هو ما ينشره Coolify.
#
# فلم تُطلَق هذه البوّابةُ مرّةً واحدةً على شيفرةٍ دُفعت، **وخضرةُ المستودع
# كانت خضرةَ صمتٍ لا خضرةَ نجاح**.
#
# و`'**'` لا اسمٌ بعينه: أسماءُ فروع هذا المشروع تتولّد آليّاً وتتغيّر،
# فمرشِّحٌ بأسماءَ محفوظةٍ يعود إلى العطل نفسِه مع أوّل فرعٍ جديد.
# الحارس: `tests/Feature/DeploymentGateGuardTest.php`.
# ══════════════════════════════════════════════════════════════════════
on:
  # الفحوصُ تبقى على كلّ دفع؛ **وملفُّ APK لا يُبنى إلّا من زرّ Run workflow.**
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'نوع التشغيل'
        required: true
        default: full_ci
        type: choice
        options:
          - full_ci
          - apk_only
      build_type:
        description: 'installable يضمن APK قابلاً للتثبيت؛ release_strict يتطلب مفتاح التوقيع الثابت'
        required: true
        default: installable
        type: choice
        options:
          - installable
          - debug
          - release_strict

  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 1) فحص بنيوي سريع — لا يعتمد على عدّ الأقواس النصّي
  # ──────────────────────────────────────────────────────────
  structural:
    name: فحص بنيوي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AMIAL-SOURCE-001: reject corrupt text and missing PHP tags before
      # framework/bootstrap checks can mistake an empty route surface for OK.
      - name: سلامة ملفات المصدر والترجمات
        run: |
          python3 01_backend/scripts/source-integrity.py
          python3 -B -m unittest discover -s 01_backend/scripts/tests -p 'test_*.py'
          bash -n 01_backend/scripts/verify.sh
      # عدّ الأقواس النصّي لا يفهم heredoc أو regex أو المصفوفات المركبة
      # في PHP، فيعطي إنذارات كاذبة. php -l هو محلّل اللغة الحقيقي.
      - name: تثبيت PHP للفحص النحوي
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: فحص PHP وكشف تعارضات الدمج
        run: |
          ! rg -n '^(<<<<<<<|=======|>>>>>>>)' --glob '*.php' --glob '*.dart' .
          find 01_backend/app 01_backend/tests 01_backend/routes 01_backend/database \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  # ──────────────────────────────────────────────────────────
  # 2) اختبارات الباكند الكاملة (PHPUnit) — القلب
  # ──────────────────────────────────────────────────────────
  backend:
    name: اختبارات الباكند (PHPUnit)
    runs-on: ubuntu-latest
    needs: structural
    # **وبناءُ APK يدويٌّ لا يجرّ معه نشرةً ولا جولةَ اختبارات.**
    # فالزرُّ الوحيدُ الذي يملكه صاحبُ المشروع لبناء تطبيقه يجب ألّا
    # يُطلق خطّافَ Coolify — وCoolify عنده على `Source: Manual` عمداً،
    # وهو ينشر بيده. (وهو ما فعله `fe64f3c` بعنوانه: «isolate manual
    # APK builds from deploy jobs».)
    if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full_ci'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: amial_pay_testing
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: amial_pay_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - name: تثبيت PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, intl, exif, pcntl
          coverage: none

      - name: كاش Composer
        uses: actions/cache@v4
        with:
          path: 01_backend/vendor
          key: composer-${{ hashFiles('01_backend/composer.lock') }}

      - name: تثبيت الحزم
        working-directory: 01_backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: تجهيز البيئة + المفاتيح
        working-directory: 01_backend
        run: |
          cp .env.example .env
          # AMIAL-PROD-READINESS-002 — **git لا يتتبّع مجلّداً فارغاً.**
          #
          # `storage/` كلُّه مُتجاهَلٌ في .gitignore، فلا يوجد في نسخة CI.
          # و`passport:keys` يكتب فيه مباشرةً فيسقط:
          #
          #   file_put_contents(…/storage/oauth-public.key):
          #   Failed to open stream: No such file or directory
          #
          # ولا يظهر محلّيّاً: المجلّدُ قائمٌ على جهاز التطوير منذ أوّل تشغيل.
          mkdir -p storage/framework/{cache/data,sessions,views} \
                   storage/logs storage/app/public bootstrap/cache
          php artisan key:generate
          # مفاتيح Passport (إلزامية لاختبارات المصادقة الـ16)
          php artisan passport:keys --force
          # مفاتيح تشفير PII (إلزامية للإقلاع)
          echo "AMIAL_PII_ENCRYPTION_KEY=$(php -r 'echo base64_encode(random_bytes(32));')" >> .env
          echo "AMIAL_PII_BLIND_INDEX_KEY=$(php -r 'echo base64_encode(random_bytes(32));')" >> .env

      - name: تحقق شاشتي الرسوم وسجل التدقيق ضد 500
        working-directory: 01_backend
        run: php artisan test --compact tests/Feature/FeeCentreScreensGuardTest.php tests/Feature/AuditScreenArabicAndFiltersTest.php

      - name: رحلة العميل الذهبية — من التسجيل إلى Tier 0 ورفع التوثيق
        working-directory: 01_backend
        run: php artisan test --compact tests/Feature/CustomerFactoryContractTest.php tests/Feature/CustomerGoldenJourneyGuardTest.php tests/Feature/CustomerKycUpgradeJourneyGuardTest.php

      - name: وصلات الإدارة الحرجة — المسار والصلاحية والمدخل
        working-directory: 01_backend
        run: php artisan test --compact tests/Feature/AdminCriticalRouteContractTest.php tests/Feature/AdminRouteReferenceGuardTest.php tests/Feature/MerchantVerificationAdminGuardTest.php

      - name: رحلة التاجر الذهبية — التسجيل ثم التشغيل ثم الاعتماد
        working-directory: 01_backend
        run: php artisan test --compact tests/Feature/SelfRegisteredMerchantIsUsableTest.php tests/Feature/RegistrationRolesTest.php

      - name: رحلة الوكيل الذهبية — الشركة فالفرع فالصراف فالعميل
        working-directory: 01_backend
        run: php artisan test --compact tests/Feature/AgentLifecycleChainTest.php


      - name: تحقق دورة البريد قبل الاختبارات الشاملة
        working-directory: 01_backend
        run: php artisan test --compact tests/Feature/EmailOtpLifecycleTest.php tests/Feature/EmailIdentityGuardTest.php tests/Feature/AmialOtpEmailTemplateTest.php tests/Feature/EmailVerificationCenterGuardTest.php tests/Feature/AgentLifecycleChainTest.php tests/Feature/InsiderDefenseTest.php tests/Feature/ArabicUserMessagesGuardTest.php tests/Feature/OpsAlertResendGuardTest.php tests/Feature/DemoOtpTest.php tests/Feature/DemoMoneyGuardTest.php tests/Feature/KycRegulatoryFieldsTest.php tests/Feature/PortalHostSeparationTest.php

      - name: تحقق عوائق الخادم السابقة
        working-directory: 01_backend
        run: php artisan test --compact tests/Feature/DonationsServiceTest.php tests/Feature/CharityServiceTest.php tests/Feature/CharityPayoutAndFundTraceGuardTest.php tests/Feature/KycSanctionTest.php tests/Feature/CustomerCenterTest.php tests/Feature/MerchantOperationsCenterTest.php tests/Feature/MerchantStaffTest.php tests/Feature/StaffDisableRevokesNowGuardTest.php tests/Feature/CustomerCreditSettleTest.php tests/Feature/CustomerCreditViewTest.php tests/Feature/LedgerCoverageGuardTest.php tests/Feature/NoTillWithoutAShiftGuardTest.php tests/Feature/BillPayServiceTest.php tests/Feature/BillPayCustomerUiGuardTest.php tests/Feature/CustomerSystemsCenterGuardTest.php tests/Feature/CustomerLegalNameLifecycleTest.php tests/Feature/CustomerProfileChangeApiTest.php tests/Feature/CustomerKycUpgradeJourneyGuardTest.php tests/Feature/ServiceCoverageGovernorateTest.php

      - name: تشغيل كل اختبارات الخادم
        working-directory: 01_backend
        run: |
          # الذيل وحده أخفى 40 إخفاقاً؛ JUnit يعرض كل سبب دون تكرار المكدسات.
          php artisan test --log-junit=phpunit_report.xml > phpunit_report.txt 2>&1 || {
            python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('phpunit_report.xml')
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  for problem in case:
                      if problem.tag in ('failure', 'error'):
                          print(f"FAILED: {case.get('class')}::{case.get('name')}")
                          print('\n'.join((problem.text or problem.get('message', '')).splitlines()[:12])[:1800])
          else:
              print('JUnit report unavailable; see process output below.')
          PY
            echo '::error::فشلت اختبارات PHPUnit — آخر 160 سطراً:'
            tail -n 160 phpunit_report.txt
            exit 1
          }
          tail -n 20 phpunit_report.txt

  # ──────────────────────────────────────────────────────────
  # 3) تحليل واختبار تطبيق Flutter
  # ──────────────────────────────────────────────────────────
  flutter:
    name: Flutter (تحليل + اختبار)
    runs-on: ubuntu-latest
    needs: structural
    defaults:
      run:
        working-directory: 02_flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # ══════════════════════════════════════════════════════════
      # AMIAL-PROD-READINESS-002 — **عتبةٌ واحدةٌ لثلاث بوّابات.**
      #
      # كانت هنا `flutter analyze` مجرّدة، فتسقط على أيّ ملاحظةٍ أسلوبيّة:
      #
      #   133 issues found.  →  exit 1
      #   (صفر خطأ · ١٣ تحذير · ١٢٠ ملاحظة)
      #
      # و`codemagic.yaml` — **وهو الذي يبني التطبيقَ الذي يُشحَن فعلاً** —
      # و`scripts/verify.sh` كلاهما يعدّ `error •` وحدَها ويطبع الباقيَ
      # غيرَ مانع، بسببٍ مكتوبٍ فيهما: «لا نعتمد على رمز خروج
      # flutter analyze: دلالته تختلف بين الإصدارات».
      #
      # **فـCI كان الشاذَّ من الثلاثة**، لا الأشدَّ: يمنع دمجاً يبني
      # codemagic نسخته بلا شكوى. وثلاثُ عتباتٍ لثلاث بوّاباتٍ تُنتج
      # «أخضرُ هنا وأحمرُ هناك» — وهو ما يُعلَّم النظرُ عنه.
      #
      # والتحذيراتُ الـ١٣٣ **تُطبَع ولا تُخفى** — دَينٌ معلومٌ يُسدَّد، لا
      # عطلٌ يمنع الشحن.
      # ══════════════════════════════════════════════════════════
      - name: تحليل (0 أخطاء تصريف)
        working-directory: 02_flutter_app
        run: |
          flutter analyze --no-pub > analyze_report.txt 2>&1 || true

          ERRORS=$(grep -E '^[[:space:]]*error •' analyze_report.txt | grep -v '• build/' || true)

          echo "تحذيرات (غير مانعة): $(grep -cE '^[[:space:]]*warning •' analyze_report.txt || true)"
          echo "ملاحظات أسلوبية    : $(grep -cE '^[[:space:]]*info •'    analyze_report.txt || true)"

          if [ -n "$ERRORS" ]; then
            echo "::error::أخطاءُ تصريفٍ في Dart — البناءُ سيسقط في codemagic:"
            echo "$ERRORS"
            exit 1
          fi
          echo "✓ صفر خطأ تصريف"
      - name: اختبارات الواجهة
        run: flutter test

  # ──────────────────────────────────────────────────────────
  # 4) التحقّق من بناء الصورتين (بلا تشغيل)
  #
  # AMIAL-PROD-READINESS-001 — **الصورةُ المفحوصةُ هي الصورةُ المشحونة.**
  #
  # كانت تُبنى `Dockerfile.prod` وحدَها، و`DEPLOY_COOLIFY.md` يقول
  # «Build Pack = Dockerfile». فما يُفحَص غيرُ ما يُنشَر.
  #
  # وقد كلّف هذا عطلاً بنصّه من قبل: إصلاحُ مجلّدات PDF كُتب في
  # `entrypoint.prod.sh` وحدَه — «وهذا الملفّ هو المُستعمَل فعلاً، فلم
  # يكن يصل» (تعليقٌ في `docker/entrypoint.sh` نفسِه).
  # ──────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────
  # AMIAL-CI-APK-002 — **بناءُ APK المجّانيُّ عاد بعد أن حُذف صامتاً.**
  #
  # بُني في `10f87a5` («مخرجٌ من رصيد Mac الذي نفد») وعزله `fe64f3c`،
  # ثمّ **حذفه `19e50e2` وعنوانُه «استبدال فاحصٍ بنيويّ»** — أربعُ
  # إزالاتٍ وصفرُ إضافة، ولا كلمةَ عنه في الرسالة. (والفاحصُ البديلُ
  # في ذاك الالتزام **أفضلُ فعلاً** — `php -l` محلِّلُ لغةٍ حقيقيٌّ لا
  # عدَّ أقواسٍ نصّيّاً؛ فالمأخذُ ما حُذف معه لا ما حلّ محلَّه.)
  #
  # **وثمنُه معروفٌ بالرقم**: فاتورةُ مئةِ دولارٍ من Codemagic على
  # دقائق `mac_mini_m2`، ثمّ نُزع المُطلِقُ كلُّه من `codemagic.yaml`
  # بقرار صاحب المشروع. **فهذا هو البديلُ الوحيدُ الباقي** — Linux
  # مجّانيٌّ بضغطة زرّ، ولا دقيقةَ Mac واحدة.
  #
  # **ولا يُبنى تلقائيّاً أبداً**: `workflow_dispatch` وحدَه، فلا يعود
  # ما أنتج الفاتورة.
  # ──────────────────────────────────────────────────────────
  apk:
    name: بناء APK (Linux — بديل Codemagic)
    runs-on: ubuntu-latest
    needs: flutter
    # البناء اليدوي يبقى هو الافتراضي. ولتمكين البناء المباشر من المحادثة
    # يمكن تشغيله بدفعة مقصودة عنوانها [build-apk] — لا يعمل على أي push عادي.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'apk_only') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]'))
    env:
      APK_BUILD_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'installable' }}
    defaults:
      run:
        working-directory: 02_flutter_app
    steps:
      - uses: actions/checkout@v4

      # Java 17 — نفسُ ما يطلبه `codemagic.yaml`، فلا يفترق البناءان.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # AMIAL-APK-BUILD-MODE-003
      #
      # installable = لا يفشل البناء لأن GitHub Secrets لم تُضبط بعد:
      # إن وُجد المفتاح الثابت نبني Release، وإلا نبني Debug موقّعاً
      # بمفتاح Android التجريبي ونسمّيه بوضوح Debug. أمّا release_strict
      # فهو وحده الذي يرفض غياب مفتاح الإنتاج.
      - name: تحديد نوع APK الفعلي قبل البناء
        env:
          KEYSTORE_B64: ${{ secrets.AMIAL_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AMIAL_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          REQUEST="${APK_BUILD_REQUEST:-installable}"
          HAVE_RELEASE_SIGNING=0
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            HAVE_RELEASE_SIGNING=1
          fi

          case "$REQUEST" in
            release_strict)
              if [ "$HAVE_RELEASE_SIGNING" -ne 1 ]; then
                echo "::error::طلبت release_strict لكن مفتاح توقيع أميال الثابت غير مضبوط في GitHub Secrets."
                echo "::error::المطلوب: AMIAL_ANDROID_KEYSTORE_B64 و AMIAL_ANDROID_KEYSTORE_PASSWORD"
                exit 1
              fi
              TYPE=release
              ;;
            debug)
              TYPE=debug
              ;;
            installable)
              if [ "$HAVE_RELEASE_SIGNING" -eq 1 ]; then
                TYPE=release
              else
                TYPE=debug
                echo "::warning::مفتاح Release غير موجود؛ سيُبنى APK Debug قابل للتثبيت بدلاً من إسقاط التشغيل كله."
              fi
              ;;
            *)
              echo "::error::نوع بناء غير معروف: $REQUEST"
              exit 1
              ;;
          esac

          echo "APK_BUILD_TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "APK_RELEASE_SIGNING_AVAILABLE=$HAVE_RELEASE_SIGNING" >> "$GITHUB_ENV"

          {
            echo "## أميال باي — نوع APK"
            echo "- المطلوب: `$REQUEST`"
            echo "- الفعلي: `$TYPE`"
            if [ "$TYPE" = "debug" ] && [ "$REQUEST" = "installable" ]; then
              echo "- السبب: أسرار توقيع Release غير مضبوطة؛ تم اختيار Debug قابل للتثبيت تلقائياً."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: بصمة المصدر (فرع + التزام + إصدار)
        run: |
          echo "======== بصمة بناء أميال باي ========"
          echo "الفرع    : ${GITHUB_REF_NAME}"
          echo "الالتزام : $(git rev-parse --short HEAD)"
          echo "الرسالة  : $(git log -1 --format=%s)"
          echo "الإصدار  : $(grep '^version:' pubspec.yaml)"
          echo "===================================="

      - name: تجهيز مفتاح التوقيع الثابت (Release فقط)
        if: env.APK_BUILD_TYPE == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.AMIAL_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AMIAL_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::مفتاح توقيع Android الثابت غير مضبوط في GitHub Secrets: $v"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/amial-release.jks
          chmod 600 android/amial-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=amial
          storeFile=amial-release.jks
          EOF

      # AMIAL-APK-INSTALL-001 — ملف واحد Universal.
      # كانت النشرة تنتج ثلاثة APK حسب المعالج، وفي الهاتف ظهر واحد 0 بايت
      # وآخر مبتوراً؛ ثم أعطى Android «مشكلة أثناء تحليل الحزمة».
      # ملف Universal يزيل اختيار المعمارية من يد المستخدم ويُفحص قبل الرفع.
      - name: بناء APK واحد قابل للتثبيت
        run: |
          if [ "$APK_BUILD_TYPE" = "release" ]; then
            flutter build apk --release
            SRC="build/app/outputs/flutter-apk/app-release.apk"
          else
            flutter build apk --debug
            SRC="build/app/outputs/flutter-apk/app-debug.apk"
          fi

          test -s "$SRC" || {
            echo "::error::لم يُنتَج APK صالح أو خرج بحجم صفر"
            exit 1
          }

          mkdir -p build/installable
          OUT="build/installable/AmialPay-${APK_BUILD_TYPE}-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: فحص سلامة الحزمة والتوقيع قبل الرفع
        run: |
          set -euo pipefail
          APK="$APK_PATH"

          echo "== الملف =="
          ls -lh "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000

          echo "== ZIP integrity =="
          unzip -t "$APK" >/tmp/apk-unzip.txt
          tail -n 2 /tmp/apk-unzip.txt

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)

          test -n "$APKSIGNER" -a -x "$APKSIGNER"
          test -n "$ZIPALIGN" -a -x "$ZIPALIGN"
          test -n "$AAPT2" -a -x "$AAPT2"

          echo "== APK signature =="
          CERT_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_CERT_SHA256=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          if [ -z "$ACTUAL_CERT_SHA256" ]; then
            ACTUAL_CERT_SHA256=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' | head -n 1)
          fi
          test -n "$ACTUAL_CERT_SHA256"

          if [ "$APK_BUILD_TYPE" = "release" ]; then
            EXPECTED_CERT_SHA256="1db2799f07dad246a5163fc5fa9ca813b47dd65b6db55eb296632bed3bbabcc7"
            if [ "$(printf '%s' "$ACTUAL_CERT_SHA256" | tr '[:upper:]' '[:lower:]')" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::توقيع APK لا يطابق هوية أميال الثابتة"
              echo "expected=$EXPECTED_CERT_SHA256"
              echo "actual=$ACTUAL_CERT_SHA256"
              exit 1
            fi
            echo "✓ توقيع Release يطابق هوية أميال الثابتة"
          else
            echo "::notice::APK Debug: تم التحقق من وجود توقيع صالح، ولا تُقارَن بصمته بمفتاح Release."
          fi

          echo "== ZIP alignment =="
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          echo "== Manifest parse =="
          "$AAPT2" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='amialpay.com'" /tmp/apk-badging.txt

          echo "== SHA256 =="
          sha256sum "$APK" | tee "build/installable/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: amial-${{ env.APK_BUILD_TYPE }}-installable-${{ github.sha }}
          path: |
            02_flutter_app/build/installable/*.apk
            02_flutter_app/build/installable/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # 4) التحقّق من بناء الصورتين (بلا تشغيل)
  #
  # AMIAL-PROD-READINESS-001 — **الصورةُ المفحوصةُ هي الصورةُ المشحونة.**
  #
  # كانت تُبنى `Dockerfile.prod` وحدَها، و`DEPLOY_COOLIFY.md` يقول
  # «Build Pack = Dockerfile». فما يُفحَص غيرُ ما يُنشَر.
  #
  # وقد كلّف هذا عطلاً بنصّه من قبل: إصلاحُ مجلّدات PDF كُتب في
  # `entrypoint.prod.sh` وحدَه — «وهذا الملفّ هو المُستعمَل فعلاً، فلم
  # يكن يصل» (تعليقٌ في `docker/entrypoint.sh` نفسِه).
  # ──────────────────────────────────────────────────────────

  docker:
    name: بناء صورتَي Docker
    runs-on: ubuntu-latest
    needs: structural
    # **وبناءُ APK يدويٌّ لا يجرّ معه نشرةً ولا جولةَ اختبارات.**
    # فالزرُّ الوحيدُ الذي يملكه صاحبُ المشروع لبناء تطبيقه يجب ألّا
    # يُطلق خطّافَ Coolify — وCoolify عنده على `Source: Manual` عمداً،
    # وهو ينشر بيده. (وهو ما فعله `fe64f3c` بعنوانه: «isolate manual
    # APK builds from deploy jobs».)
    if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full_ci'
    strategy:
      fail-fast: false
      matrix:
        # الأولى هي المنشورةُ اليوم، والثانيةُ هي المشدَّدة.
        dockerfile: [Dockerfile, Dockerfile.prod]
    steps:
      - uses: actions/checkout@v4
      - name: بناء ${{ matrix.dockerfile }}
        working-directory: 01_backend
        run: docker build -f ${{ matrix.dockerfile }} -t amial-pay:ci-${{ matrix.dockerfile }} .

  # ──────────────────────────────────────────────────────────
  # AMIAL-CD-TRIGGER-001 — **الدفعُ لا ينشر، وهذا آخرُ بابٍ مغلق.**
  #
  # **الثمنُ الذي دُفع، بنصّ صاحب المشروع:** «منذ أيّامٍ وأنا لم أستطع
  # عملَ بناءٍ للتطبيق أو نشرَ المشروع».
  #
  # Coolify على `Source: Manual` في كلّ نشراته — فالدفعُ إلى الفرع
  # المنشور لا يُطلق شيئاً، وكلُّ ما في المستودع يقف حتّى يفتح إنسانٌ
  # البابَ بيده. **وبابٌ يُفتَح باليد يُنسى**، فتبقى الشيفرةُ الجديدةُ
  # في git والقديمةُ تخدم العملاء، ولا سطرَ يقول ذلك.
  #
  # **ولا يُضبَط Coolify من مستودع** — هو لوحةٌ خارجيّة. لكنّه يقبل
  # خطّافَ نشرٍ بعنوانٍ واحد. فيُوضَع العنوانُ سرّاً واحداً، ويصير
  # النشرُ تلقائيّاً إلى الأبد:
  #
  #     Coolify ← المشروع ← Webhooks ← انسخ «Deploy Webhook»
  #     GitHub  ← Settings ← Secrets ← New secret
  #                 الاسم : COOLIFY_DEPLOY_HOOK
  #
  # ══════════════════════════════════════════════════════════
  # **وثلاثةُ حدودٍ مقصودةٌ تُقرأ ولا تُخمَّن:**
  #
  # ① **بعد البوّابة لا معها** (`needs`) — نشرٌ يسبق الفحصَ يشحن ما
  #    لم يُفحَص، وهو أسوأ من نشرٍ يدويّ.
  #
  # ② **فرعُ النشر وحدَه.** Coolify يستورد
  #    `claude/project-code-review-yjagv`؛ وخطّافٌ يُطلَق من كلّ فرعٍ
  #    ينشر شيفرةً ليست هي المقصودة.
  #
  # ③ **وغيابُ السرّ ليس فشلاً.** الخطوةُ تُخطَّى وتقول لماذا — فوظيفةٌ
  #    حمراءُ على إعدادٍ لم يُضبَط بعد تُعوّد القارئَ على تجاهل الأحمر.
  #    (وهي القاعدةُ السابعة: «غيرُ معروف» ليس فشلاً، ويُقال بسببه.)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: إطلاق نشرة Coolify
    runs-on: ubuntu-latest
    # موقع أميال (Laravel/Docker) وتطبيق Flutter منتجان مستقلان. فشل اختبار
    # واجهة الجوال يبقى أحمر ويمنع بناء APK، لكنه لا يترك موقع الويب متوقفاً
    # بعدما اجتاز فحصه البنيوي واختبارات الباكند وبناء الصورة المنشورة.
    needs: [structural, backend, docker]
    # **ولا نشرَ من زرّ بناء APK** — انظر `AMIAL-CI-APK-002` أعلاه.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full_ci')
      && github.ref == 'refs/heads/claude/project-code-review-yjagv'
    steps:
      - name: نداء خطّاف النشر
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice title=النشر التلقائي غير مضبوط::" \
              "السرُّ COOLIFY_DEPLOY_HOOK غيرُ موجود، فالنشرُ ما زال يدويّاً." \
              "اضبطه مرّةً واحدةً: Coolify ← Webhooks ← Deploy Webhook،" \
              "ثمّ GitHub ← Settings ← Secrets ← COOLIFY_DEPLOY_HOOK."
            exit 0
          fi

          # `--fail-with-body` لا `--fail` وحدَها: ٤٠٤ على خطّافٍ خاطئ
          # يجب أن يُظهر نصَّ الردّ، وإلّا صار «فشل» بلا سبب.
          code=$(curl -sS --fail-with-body -o /tmp/hook.out -w '%{http_code}' \
                   --max-time 60 -X GET "$HOOK") || {
            echo "::error title=تعذّر إطلاق النشرة::$(head -c 400 /tmp/hook.out)"
            exit 1
          }

          echo "::notice title=أُطلقت النشرة::ردّ Coolify $code على ${GITHUB_SHA::7}"
          head -c 400 /tmp/hook.out || true

      # **وإطلاقُ النشرة ليس نجاحَها.** Coolify يردّ فورَ القبول، والبناءُ
      # يجري بعده دقائق. فيُقال ذلك صراحةً لئلّا تُقرأ الخضرةُ «نُشر».
      - name: ما بعد الإطلاق
        run: |
          echo "::notice title=الخطوة التالية::" \
            "الإطلاقُ ليس اكتمالاً — تابِع Coolify حتّى Running (healthy)،" \
            "ثمّ شغّل: php artisan amial:readiness --base=https://amialpay.com"
