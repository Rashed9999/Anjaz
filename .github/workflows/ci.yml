name: أميال باي — CI

# يشغّل: فحص بنيوي سريع → اختبارات الباكند الكاملة (747) → تحليل/اختبار Flutter
# → التحقّق من بناء صورة Docker. أي فشل يوقف الدمج.

# ══════════════════════════════════════════════════════════════════════
# AMIAL-PROD-READINESS-001 — **المرشِّحُ يغطّي كلَّ فرع، لأنّ كلَّ فرعٍ يُنشَر.**
#
# كان `[main, develop]` — **ولا وجودَ لأيٍّ منهما على origin**. الفرعان
# الوحيدان `claude/project-development-continuation-7oxhip` و
# `claude/project-code-review-yjagv`، وأحدُهما هو ما ينشره Coolify.
#
# فلم تُطلَق هذه البوّابةُ مرّةً واحدةً على شيفرةٍ دُفعت، **وخضرةُ المستودع
# كانت خضرةَ صمتٍ لا خضرةَ نجاح**.
#
# و`'**'` لا اسمٌ بعينه: أسماءُ فروع هذا المشروع تتولّد آليّاً وتتغيّر،
# فمرشِّحٌ بأسماءَ محفوظةٍ يعود إلى العطل نفسِه مع أوّل فرعٍ جديد.
# الحارس: `tests/Feature/DeploymentGateGuardTest.php`.
# ══════════════════════════════════════════════════════════════════════
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 1) فحص بنيوي سريع (توازن الأقواس) — لا يحتاج تبعيات
  # ──────────────────────────────────────────────────────────
  structural:
    name: فحص بنيوي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: توازن الأقواس (PHP/Dart)
        run: |
          node -e '
          const fs=require("fs"),path=require("path");
          function strip(s){let o="",i=0,n=s.length;
           while(i<n){const c=s[i],d=s[i+1];
           if(c==="/"&&d==="/"){while(i<n&&s[i]!=="\n")i++;continue;}
           if(c==="#"){while(i<n&&s[i]!=="\n")i++;continue;}
           if(c==="/"&&d==="*"){i+=2;while(i<n&&!(s[i]==="*"&&s[i+1]==="/"))i++;i+=2;continue;}
           if(c==="\x27"||c==="\x22"){const q=c;i++;while(i<n&&s[i]!==q){if(s[i]==="\\")i++;i++;}i++;o+="X";continue;}
           o+=c;i++;}return o;}
          function bal(f){try{const s=strip(fs.readFileSync(f,"utf8"));const c={};
           for(const ch of s)if("(){}[]".includes(ch))c[ch]=(c[ch]||0)+1;
           return(c["("]||0)===(c[")"]||0)&&(c["{"]||0)===(c["}"]||0)&&(c["["]||0)===(c["]"]||0);
           }catch{return false;}}
          let ok=0,fail=0;const fails=[];
          function walk(dir){if(!fs.existsSync(dir))return;
           for(const e of fs.readdirSync(dir)){const full=path.join(dir,e);
           if(fs.statSync(full).isDirectory()){walk(full);continue;}
           if(e.endsWith(".php")||e.endsWith(".dart")){if(bal(full))ok++;else{fail++;fails.push(full);}}}}
          ["01_backend/app","01_backend/tests","01_backend/routes","01_backend/database"].forEach(walk);
          walk("02_flutter_app/lib");
          console.log(ok+" ✓  "+fail+" ✗");
          fails.forEach(f=>console.log("  ✗ "+f));
          process.exit(fail===0?0:1);
          '

  # ──────────────────────────────────────────────────────────
  # 2) اختبارات الباكند الكاملة (PHPUnit) — القلب
  # ──────────────────────────────────────────────────────────
  backend:
    name: اختبارات الباكند (PHPUnit)
    runs-on: ubuntu-latest
    needs: structural
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: amial_pay_testing
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: amial_pay_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - name: تثبيت PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, intl, exif, pcntl
          coverage: none

      - name: كاش Composer
        uses: actions/cache@v4
        with:
          path: 01_backend/vendor
          key: composer-${{ hashFiles('01_backend/composer.lock') }}

      - name: تثبيت الحزم
        working-directory: 01_backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: تجهيز البيئة + المفاتيح
        working-directory: 01_backend
        run: |
          cp .env.example .env
          php artisan key:generate
          # مفاتيح Passport (إلزامية لاختبارات المصادقة الـ16)
          php artisan passport:keys --force
          # مفاتيح تشفير PII (إلزامية للإقلاع)
          echo "AMIAL_PII_ENCRYPTION_KEY=$(php -r 'echo base64_encode(random_bytes(32));')" >> .env
          echo "AMIAL_PII_BLIND_INDEX_KEY=$(php -r 'echo base64_encode(random_bytes(32));')" >> .env

      - name: تشغيل كل الاختبارات (747)
        working-directory: 01_backend
        run: php artisan test

  # ──────────────────────────────────────────────────────────
  # 3) تحليل واختبار تطبيق Flutter
  # ──────────────────────────────────────────────────────────
  flutter:
    name: Flutter (تحليل + اختبار)
    runs-on: ubuntu-latest
    needs: structural
    defaults:
      run:
        working-directory: 02_flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: تحليل (0 أخطاء)
        run: flutter analyze
      - name: اختبارات الواجهة
        run: flutter test

  # ──────────────────────────────────────────────────────────
  # 4) التحقّق من بناء الصورتين (بلا تشغيل)
  #
  # AMIAL-PROD-READINESS-001 — **الصورةُ المفحوصةُ هي الصورةُ المشحونة.**
  #
  # كانت تُبنى `Dockerfile.prod` وحدَها، و`DEPLOY_COOLIFY.md` يقول
  # «Build Pack = Dockerfile». فما يُفحَص غيرُ ما يُنشَر.
  #
  # وقد كلّف هذا عطلاً بنصّه من قبل: إصلاحُ مجلّدات PDF كُتب في
  # `entrypoint.prod.sh` وحدَه — «وهذا الملفّ هو المُستعمَل فعلاً، فلم
  # يكن يصل» (تعليقٌ في `docker/entrypoint.sh` نفسِه).
  # ──────────────────────────────────────────────────────────
  docker:
    name: بناء صورتَي Docker
    runs-on: ubuntu-latest
    needs: structural
    strategy:
      fail-fast: false
      matrix:
        # الأولى هي المنشورةُ اليوم، والثانيةُ هي المشدَّدة.
        dockerfile: [Dockerfile, Dockerfile.prod]
    steps:
      - uses: actions/checkout@v4
      - name: بناء ${{ matrix.dockerfile }}
        working-directory: 01_backend
        run: docker build -f ${{ matrix.dockerfile }} -t amial-pay:ci-${{ matrix.dockerfile }} .
