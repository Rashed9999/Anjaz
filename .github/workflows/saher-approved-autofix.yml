name: Saher — reviewed recipe to Draft PR

# Manual-only: the payment app never receives GitHub credentials.
on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "Security-reviewed allowlisted recipe"
        type: choice
        required: true
        options:
          - merchant-note-rbac-0033
      finding_ref:
        description: "Existing Saher reference, e.g. SAHER-SECUR-0033"
        type: string
        required: true
      mode:
        description: "preview makes no change; draft_pr requires explicit confirmation"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - draft_pr
      confirmation:
        description: "For draft_pr enter CREATE_DRAFT_PR exactly"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: saher-reviewed-recipe-${{ inputs.recipe }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only validation and patch preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RECIPE: ${{ inputs.recipe }}
      FINDING_REF: ${{ inputs.finding_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-code-review-yjagv
          persist-credentials: false
      - name: Validate recipe sandbox and tests
        run: python3 -m unittest discover -s .github/saher/tests -v
      - name: Preview only, without code writes or secrets
        id: preview
        run: |
          python3 .github/saher/apply_recipe.py \
            --root . --recipe "$RECIPE" --finding "$FINDING_REF"
          git diff --exit-code
      - name: Summarize inspection
        run: |
          echo 'Read-only Saher recipe inspection finished. No code or permissions changed.' >> "$GITHUB_STEP_SUMMARY"

  open_draft:
    name: Write-scoped Draft PR only, after successful inspection
    if: inputs.mode == 'draft_pr'
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      RECIPE: ${{ inputs.recipe }}
      FINDING_REF: ${{ inputs.finding_ref }}
      CONFIRMATION: ${{ inputs.confirmation }}
      TARGET_BRANCH: claude/project-code-review-yjagv
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enforce explicit review-only confirmation
        run: |
          if [ "$CONFIRMATION" != "CREATE_DRAFT_PR" ]; then
            echo "::error::Draft PR creation requires CREATE_DRAFT_PR confirmation."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: claude/project-code-review-yjagv
          fetch-depth: 1
      - name: Revalidate recipe before applying it
        run: python3 -m unittest discover -s .github/saher/tests -v
      - name: Prepare PHP lint for the generated change
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Apply approved recipe to disposable checkout only
        id: patch
        run: |
          python3 .github/saher/apply_recipe.py \
            --root . --recipe "$RECIPE" --finding "$FINDING_REF" --apply
      - name: Review changed PHP source before any branch push
        if: steps.patch.outputs.changed == 'true'
        run: |
          CHANGED_FILE="${{ steps.patch.outputs.changed_file }}"
          php -l "$CHANGED_FILE"
          git diff --check
          git diff -- "$CHANGED_FILE"
      - name: Open Draft PR (never merge or deploy)
        if: steps.patch.outputs.changed == 'true'
        run: |
          CHANGED_FILE="${{ steps.patch.outputs.changed_file }}"
          BRANCH="fix/saher-reviewed-${RECIPE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- "$CHANGED_FILE"
          git diff --cached --check
          git commit -m "fix(saher): ${RECIPE} for ${FINDING_REF}"
          git push origin "$BRANCH"
          printf 'Saher finding: %s\nApproved recipe: %s\n\n' "$FINDING_REF" "$RECIPE" > /tmp/saher-pr.md
          printf 'Review-only patch from a vetted recipe. Never auto-merge or auto-deploy.\n\n' >> /tmp/saher-pr.md
          printf 'Required: security review, full CI, deployment approval, and fresh Saher scan.\n' >> /tmp/saher-pr.md
          gh pr create --draft --base "$TARGET_BRANCH" --head "$BRANCH" \
            --title "fix(saher): reviewed ${RECIPE} (${FINDING_REF})" \
            --body-file /tmp/saher-pr.md
      - name: Record outcome accurately
        if: always()
        run: |
          echo 'This job never merges or deploys.' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.patch.outputs.outcome }}" = "ALREADY_APPLIED" ]; then
            echo 'Fix already applied; no PR created.' >> "$GITHUB_STEP_SUMMARY"
          fi
