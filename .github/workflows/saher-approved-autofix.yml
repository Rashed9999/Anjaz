name: Saher — reviewed recipe to Draft PR

# Manual-only. The payment application receives no GitHub write token.
# GitHub's short-lived workflow token is restricted to this invocation.
on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "Security-reviewed allowlisted recipe"
        type: choice
        required: true
        options:
          - merchant-note-rbac-0033
      finding_ref:
        description: "Existing Saher reference, e.g. SAHER-SECUR-0033"
        type: string
        required: true
      mode:
        description: "preview makes no change; draft_pr creates a reviewable PR"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - draft_pr
      confirmation:
        description: "For draft_pr enter CREATE_DRAFT_PR exactly"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  approved-recipe:
    name: Validate and prepare review-only security patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: saher-recipe-${{ inputs.recipe }}
      cancel-in-progress: false
    env:
      RECIPE: ${{ inputs.recipe }}
      FINDING_REF: ${{ inputs.finding_ref }}
      MODE: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.confirmation }}
      TARGET_BRANCH: claude/project-code-review-yjagv
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enforce explicit review-only invocation
        run: |
          if [ "$MODE" = "draft_pr" ] && [ "$CONFIRMATION" != "CREATE_DRAFT_PR" ]; then
            echo "::error::Draft PR creation requires CREATE_DRAFT_PR confirmation."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: claude/project-code-review-yjagv
          fetch-depth: 1

      - name: Test the recipe sandbox with only Python standard library
        run: python3 -m unittest discover -s .github/saher/tests -v

      - name: Apply approved recipe to ephemeral checkout (or preview)
        id: patch
        run: |
          args=()
          if [ "$MODE" = "draft_pr" ]; then args+=(--apply); fi
          python3 .github/saher/apply_recipe.py \
            --root . --recipe "$RECIPE" --finding "$FINDING_REF" "${args[@]}"

      - name: Review patch and check PHP source syntax
        if: steps.patch.outputs.changed == 'true'
        run: |
          CHANGED_FILE="${{ steps.patch.outputs.changed_file }}"
          php -l "$CHANGED_FILE"
          git diff --check
          git diff -- "$CHANGED_FILE"

      - name: Open Draft PR (never merge or deploy)
        if: inputs.mode == 'draft_pr' && steps.patch.outputs.changed == 'true'
        run: |
          CHANGED_FILE="${{ steps.patch.outputs.changed_file }}"
          BRANCH="fix/saher-reviewed-${RECIPE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- "$CHANGED_FILE"
          git diff --cached --check
          git commit -m "fix(saher): ${RECIPE} for ${FINDING_REF}"
          git push origin "$BRANCH"
          printf 'Saher finding: %s\nApproved recipe: %s\n\n' "$FINDING_REF" "$RECIPE" > /tmp/saher-pr.md
          printf 'This is a review-only code change generated from a vetted exact-match recipe.\n\n' >> /tmp/saher-pr.md
          printf 'Required: human security review, full CI, deployment approval, and a fresh Saher scan.\n' >> /tmp/saher-pr.md
          gh pr create --draft --base "$TARGET_BRANCH" --head "$BRANCH" \
            --title "fix(saher): reviewed ${RECIPE} (${FINDING_REF})" \
            --body-file /tmp/saher-pr.md

      - name: Record the honest outcome
        if: always()
        run: |
          echo 'Saher manual-only recipe job. No auto-merge and no deployment.' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.patch.outputs.outcome }}" = "ALREADY_APPLIED" ]; then
            echo 'Recipe already applied; no new PR was created.' >> "$GITHUB_STEP_SUMMARY"
          fi
