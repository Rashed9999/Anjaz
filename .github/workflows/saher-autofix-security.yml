name: Saher AutoFix — focused security gates

on:
  push:
    branches:
      - 'feature/anjaz/saher-*'
  pull_request:
    branches: ['**']
    paths:
      - '01_backend/app/Saher/**'
      - '01_backend/app/Http/Controllers/Admin/Saher*'
      - '01_backend/app/Http/Middleware/**'
      - '01_backend/app/Services/Saher*'
      - '01_backend/database/migrations/*saher*'
      - '01_backend/routes/admin/amial.php'
      - '01_backend/resources/views/admin-views/amial/saher/**'
      - '01_backend/tests/Feature/Saher*'
      - '01_backend/tests/Feature/AppMoneyIdempotencyTest.php'
      - '.github/workflows/saher-autofix-security.yml'

permissions:
  contents: read

concurrency:
  group: saher-security-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  focused-saher:
    name: Saher AutoFix RBAC, containment & invariants (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: amial_pay_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: amial_pay_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, intl, exif, pcntl
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: 01_backend/vendor
          key: composer-${{ hashFiles('01_backend/composer.lock') }}
      - name: Install Composer dependencies
        working-directory: 01_backend
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Initialize test environment and application keys
        working-directory: 01_backend
        run: |
          cp .env.example .env
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs storage/app/public bootstrap/cache
          php artisan key:generate
          php artisan passport:keys --force
          echo "AMIAL_PII_ENCRYPTION_KEY=$(php -r 'echo base64_encode(random_bytes(32));')" >> .env
          echo "AMIAL_PII_BLIND_INDEX_KEY=$(php -r 'echo base64_encode(random_bytes(32));')" >> .env
      - name: Verify Saher HTTP and RBAC boundaries
        working-directory: 01_backend
        run: |
          tests=(
            tests/Feature/SaherAutoFixQuarantineTest.php
            tests/Feature/SaherRulingGuardTest.php
            tests/Feature/AppMoneyIdempotencyTest.php
          )
          if [ -f tests/Feature/SaherRemediationWorkflowTest.php ]; then
            tests+=(tests/Feature/SaherRemediationWorkflowTest.php)
          fi
          php artisan test --compact "${tests[@]}"
