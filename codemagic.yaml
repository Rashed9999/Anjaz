# AMIAL — إعداد بناء Codemagic لتطبيق أميال باي (Flutter)
# يبني نسخة release مقسّمة حسب معالج الهاتف → حجم أصغر بكثير من debug.
# التطبيق داخل مجلّد 02_flutter_app (مستودع متعدّد المجلّدات).

workflows:
  amyal-android-release:
    name: أميال باي — Android Release (حجم صغير)
    # AMIAL-CI-WASTE-001 — **وسقفُ المدّة يُقاس على البناء لا على السخاء.**
    #
    # البناءُ الناجحُ يستغرق ~٥ دقائق (السجلّ: `BUILD FAILED in 3m 18s`
    # بعد ٣ دقائق من Gradle). وسقفُ الساعة يعني أنّ بناءً عالقاً **يبتلع
    # ساعةً كاملةً من رصيدٍ شهريٍّ محدود** قبل أن يُقتَل — ثمّ لا يبقى
    # رصيدٌ للبناء الذي يصلح.
    max_build_duration: 25
    # الخطة المجانية في Codemagic متاحة على أجهزة Mac فقط
    instance_type: mac_mini_m2

    # ══════════════════════════════════════════════════════════════════
    # AMIAL-CI-COST-001 — **البناءُ يدويٌّ بقرارٍ صريحٍ من صاحب المشروع.**
    #
    # **الثمنُ الذي دُفع: فاتورةُ مئةِ دولار.** أرسل صاحبُ المشروع صورةَ
    # لوحة Codemagic: سبعةُ بناءاتٍ متتاليةٍ (‏#150–#156) × ~٨ دقائقَ على
    # `mac_mini_m2` — **ولا واحدٌ من التزاماتها غيّر ملفَّ فلاتر واحداً**.
    # رسومٌ ونزاعاتٌ ولوحةُ وكلاء، كلُّها خادميّة. سبعُ نسخِ APK متطابقة.
    #
    # وقِيس على المستودع منذ إضافة المُطلِق (‏`155bb14`، ٢٤ أغسطس):
    #
    #     التزاماتٌ مدفوعة  : 154
    #     منها يمسّ فلاتر   : 61
    #     بلا أثرٍ في التطبيق: 93   ← ٦٠٪ بناءٍ لا يُنتج شيئاً جديداً
    #
    # **وكلُّ التزامٍ يُدفَع إلى فرعين** (تطويرٍ ونشر)، فكان يُبنى مرّتين.
    #
    # ══════════════════════════════════════════════════════════════════
    # **ولمَ لا `when: changeset` بدل النزع الكامل:** عُرضت على صاحب
    # المشروع أربعُ صيغ — بوّابةُ تغييرٍ على `02_flutter_app`، ونزعٌ كامل،
    # وعلامةٌ في رسالة الالتزام، وبوّابةٌ مع فرعٍ واحد — **واختار النزعَ
    # الكامل صراحةً**. فلا يُبنى شيءٌ إلّا بضغطةٍ منه في اللوحة.
    #
    # **وهذا يُعيد ما شكا منه في ٢٤ أغسطس** («لم أستطع عملَ بناءٍ
    # للتطبيق») — وهو يعلمه ويقبله: الصمتُ الذي يختاره أرخصُ من فاتورةٍ
    # لا يختارها. **فلا يُعاد المُطلِقُ استنتاجاً من تلك الشكوى**، ولا
    # إلّا بطلبٍ جديدٍ صريح.
    #
    # ولذلك قُلب `BuildTriggerGuardTest`: كان يشترط وجودَ المُطلِق، وصار
    # يشترط غيابَه. **فقرارٌ مكتوبٌ في تعليقٍ وحدَه يُنقَض بأوّل جلسة.**
    #
    # ══════════════════════════════════════════════════════════════════
    # **ويبقى للإنسان أن يتحقّق من اللوحة**: نزعُ `triggering` من هذا
    # الملفّ يمنع البناءَ الذي يُطلقه هذا الملفّ. فإن كان في إعدادات
    # التطبيق على Codemagic **مُطلِقٌ مضبوطٌ من الواجهة** أو خطّافُ ويب
    # مستقلّ، فهو خارج المستودع ولا يراه أيُّ حارسٍ هنا — يُطفأ من اللوحة.
    # ══════════════════════════════════════════════════════════════════


    environment:
      flutter: stable
      java: 17
    scripts:
      # AMIAL-BUILD-PROOF-001: أكثر سؤال تكرّر بعد كل بناء هو «أين التعديلات؟».
      # السبب في كل مرة كان أن الـ APK بُني من التزام أقدم من العمل المدفوع.
      # هذه الخطوة تطبع الفرع والالتزام ورقم الإصدار في أعلى سجلّ البناء،
      # فيُحسم السؤال من السجلّ قبل تنزيل الملف — بلا تخمين.
      - name: بصمة المصدر (فرع + التزام + إصدار)
        script: |
          echo "======== بصمة بناء أميال باي ========"
          echo "الفرع    : $(git rev-parse --abbrev-ref HEAD)"
          echo "الالتزام : $(git rev-parse --short HEAD)"
          echo "التاريخ  : $(git log -1 --format=%cd --date=iso)"
          echo "الرسالة  : $(git log -1 --format=%s)"
          echo "الإصدار  : $(grep '^version:' 02_flutter_app/pubspec.yaml)"
          echo "===================================="
      - name: جلب الحزم
        script: |
          cd 02_flutter_app
          flutter pub get
      # AMIAL-CI-GATE-001: بوّابة تصريف قبل Gradle.
      # بناء Gradle يستغرق ~4 دقائق ثم يفشل على خطأ تصريف Dart كان يمكن
      # كشفه في 10 ثوانٍ. هذه الخطوة تُفشل البناء فوراً عند أي خطأ تصريف
      # وتطبع رسالته — وتتجاهل التحذيرات والملاحظات الأسلوبية عمداً حتى
      # لا يتحوّل الحارس إلى ضجيج يُعطَّل.
      - name: بوّابة التصريف (flutter analyze)
        script: |
          cd 02_flutter_app
          # لا نعتمد على رمز خروج flutter analyze: دلالته تختلف بين الإصدارات،
          # وبعضها يُفشل على الملاحظات الأسلوبية رغم --no-fatal-infos. نقرأ
          # التقرير بأنفسنا ونُفشل على أسطر error وحدها — سلوك واحد أياً كان
          # إصدار Flutter على آلة البناء.
          # ملاحظة على الأنماط: flutter يحاذي عمود الشدّة بمسافات، فتصير
          # "warning •" بلا مسافة بادئة و"  error •" بمسافتين و"   info •"
          # بثلاث. لذلك نُثبّت الأنماط بـ ^[[:space:]]* لا بمسافة مكتوبة.
          flutter analyze --no-pub > analyze_report.txt 2>&1 || true
          # طبقة ثانية بعد exclude في analysis_options.yaml: نتجاهل أي خطأ
          # مساره داخل build/ — مصادر حزم خارجية تنسخها آلة البناء، ليست لنا
          # ولا نملك إصلاحها. الحارس يحرس شيفرتنا وحدها.
          grep -E '^[[:space:]]*error •' analyze_report.txt \
            | grep -v '• build/' > compile_errors.txt || true
          if [ -s compile_errors.txt ]; then
            echo "❌ أخطاء تصريف — البناء متوقّف:"
            cat compile_errors.txt
            exit 1
          fi
          echo "✅ صفر خطأ تصريف"
          echo "تحذيرات (غير مانعة): $(grep -cE '^[[:space:]]*warning •' analyze_report.txt)"
          echo "ملاحظات أسلوبية    : $(grep -cE '^[[:space:]]*info •'    analyze_report.txt)"
      - name: بناء APK release مقسّم حسب المعالج
        script: |
          cd 02_flutter_app
          # --split-per-abi ينتج APK منفصلاً لكل معالج (arm64 للهواتف الحديثة)
          # فبدل حزمة عملاقة تحوي كل المعماريات، حجم كل ملف ~الثلث.
          flutter build apk --release --split-per-abi
    artifacts:
      # ستجد عدّة ملفات؛ نزّل «arm64-v8a» للهواتف الحديثة (الأصغر والأنسب).
      - 02_flutter_app/build/app/outputs/flutter-apk/*.apk
