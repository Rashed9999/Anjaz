[supervisord]
nodaemon=true
logfile=/var/www/html/storage/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stopsignal=QUIT
stopwaitsecs=15
stderr_logfile=/var/www/html/storage/logs/php-fpm.err
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile=/var/www/html/storage/logs/php-fpm.out
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stopsignal=QUIT
stopwaitsecs=10
stderr_logfile=/var/www/html/storage/logs/nginx.err
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile=/var/www/html/storage/logs/nginx.out
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:queue-worker]
; --tries=2 + failed_jobs table (Laravel القياسي) يحفظان المهام الفاشلة
; للمراجعة بدل فقدانها — بلا أيّ تعديل على منطق أيّ Job نفسه.
command=php /var/www/html/artisan queue:work --sleep=3 --tries=2 --max-time=3600 --timeout=600 --queue=receipts,default,notifications
; AMIAL-FIX: عمّال الطابور يعملون بمستخدم غير جذري (تقليل أثر أيّ ثغرة تنفيذ)
user=www-data
autostart=true
autorestart=true
numprocs=3
process_name=%(program_name)s_%(process_num)02d
stopsignal=TERM
; مهلة كافية لإنهاء أيّ معاملة قيد التنفيذ (تحويل، تسوية) قبل القتل القسري
stopwaitsecs=600
stderr_logfile=/var/www/html/storage/logs/queue.err
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
stdout_logfile=/var/www/html/storage/logs/queue.out
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:scheduler]
; بديل الـ cron التقليدي داخل الحاوية — يُشغِّل schedule:run كل دقيقة
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run >> /var/www/html/storage/logs/scheduler.log 2>&1; sleep 60; done"
user=www-data
autostart=true
autorestart=true
stderr_logfile=/var/www/html/storage/logs/scheduler.err
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile=/var/www/html/storage/logs/scheduler.out
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
