user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── إخفاء بصمة الخادم ──────────────────────────────
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # ── ضغط الاستجابات ─────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Log format (يشمل الـ real IP بعد trust proxies) ──
    log_format amial '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';
    access_log /var/log/nginx/access.log amial;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        root /var/www/html/public;
        index index.php;

        # ── رؤوس أمان قياسية ───────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS يُفعَّل فقط خلف HTTPS فعلي (عادة تديره Cloudways/CDN عند SSL termination)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── حظر الملفّات الحسّاسة صراحة ────────────────
        location ~ /\.(env|git|htaccess) {
            deny all;
            return 404;
        }
        location ~ ^/(storage/logs|storage/framework|bootstrap/cache)/ {
            deny all;
            return 404;
        }
        location ~ \.(sql|log|bak)$ {
            deny all;
            return 404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 120;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 16k;

            # AMIAL-DEVOPS-001 — IP الحقيقي خلف reverse proxy المُستضيف
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

            # منع تنفيذ PHP من مجلّدات الرفع (حماية أساسية)
            fastcgi_param PHP_ADMIN_VALUE "open_basedir=/var/www/html";
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
