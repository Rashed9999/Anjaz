user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    server {
        # منافذ الإصغاء يُولّدها entrypoint في listen.conf (يغطّي منفذ Railway
        # ومنفذ الدومين معاً — IPv4 و IPv6) فينتهي أي لبس في المنافذ.
        include /etc/nginx/listen.conf;
        root /var/www/html/public;
        index index.php;

        # ══════════════════════════════════════════════════════════════
        # AMIAL-PROD-READINESS-001 — **أُزيل الردُّ الثابت من هنا عمداً.**
        #
        # كان:
        #     location = /railway-health { return 200 "ok"; }
        #
        # ونصُّ تعليقه القديم يصف العطل بدقّة: «يضمن نجاح فحص Railway فور
        # بدء nginx **مهما كانت حالة التطبيق**». وهو بالضبط ما لا يُراد من
        # فحص نشر: أن ينجح مهما كانت الحالة.
        #
        # فصار المسارُ يمرّ إلى Laravel (`HealthCheckController::deployProbe`)
        # فيفحص القاعدةَ والتخزينَ بالعمل، مع نافذةِ سماحٍ للإقلاع تمنع
        # إسقاطَ نشرةٍ سليمةٍ ما دامت الهجرةُ تجري.
        #
        # **ولا يُعاد سطرُ `return 200` هنا** — يمرّ عبر `location /` أدناه.
        # الحارس: `tests/Feature/DeploymentProbeGuardTest.php`.
        # ══════════════════════════════════════════════════════════════

        # أميال باي API + WhatsApp Webhook
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9001;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 120;

            # ══════════════════════════════════════════════════════════
            # AMIAL-PDF-TRUNCATION-001 — مخازن كبيرة تكفي الإيصال كاملاً.
            #
            # **العطل الذي أدخل هذا: «Connection closed while receiving
            # data» على تنزيل إيصال PDF.**
            #
            # وكان يُقاس سليماً في كلّ مكان: التوليد ٠٫٢٩ ثانية، والردّ
            # ٢٠٠ بترويسة `%PDF-1.4` وطولٍ معلَنٍ يطابق الفعليّ. فالشيفرة
            # بريئة — والعطل بين nginx وPHP.
            #
            # لأنّ المخازن الافتراضيّة ٤ كيلوبايت × ٨ ≈ ٣٢ كيلوبايت،
            # وإيصالُنا ١٠٢ كيلوبايت. فما زاد يُكتب إلى ملفٍّ مؤقّت على
            # القرص (`fastcgi_temp`) — ومجلّدُه لم يُنشأ ولم يُملَّك
            # لـ`www-data` في الصورة. فيفشل الكتابة **بعد أن أُرسلت
            # الترويسات**، فتُقطع الاستجابة في منتصفها.
            #
            # وهذا يفسّر كلّ ما رُصد: JSON الصغير يعمل (دون ٣٢ك فيبقى في
            # الذاكرة)، والـPDF وحده يسقط، ويسقط في كلّ محاولة.
            #
            # فتُوسَّع المخازن حتى يبقى الإيصال كلُّه في الذاكرة ولا يُلمس
            # القرص أصلاً. وما تجاوزها له مجلّدٌ صار موجوداً ومملوكاً
            # (انظر Dockerfile).
            fastcgi_buffer_size       32k;
            fastcgi_buffers           64 32k;      # ٢ ميغابايت
            fastcgi_busy_buffers_size 64k;
            fastcgi_temp_file_write_size 256k;
            fastcgi_max_temp_file_size   1024m;

            # AMIAL-DEVOPS-001 — يضمن وصول IP الحقيقي لـ Laravel حتى
            # لو وُجد reverse proxy أمام هذا الـ Nginx (Cloudways/CDN)
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
