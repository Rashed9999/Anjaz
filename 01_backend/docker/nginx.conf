user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    server {
        # منافذ الإصغاء يُولّدها entrypoint في listen.conf (يغطّي منفذ Railway
        # ومنفذ الدومين معاً — IPv4 و IPv6) فينتهي أي لبس في المنافذ.
        include /etc/nginx/listen.conf;
        root /var/www/html/public;
        index index.php;

        # AMIAL-MAINT: فحص صحّة يردّه nginx مباشرةً (بلا PHP/قاعدة بيانات)
        # يضمن نجاح فحص Railway فور بدء nginx مهما كانت حالة التطبيق.
        location = /railway-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # أميال باي API + WhatsApp Webhook
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9001;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 120;

            # AMIAL-DEVOPS-001 — يضمن وصول IP الحقيقي لـ Laravel حتى
            # لو وُجد reverse proxy أمام هذا الـ Nginx (Cloudways/CDN)
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
