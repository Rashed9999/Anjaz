[supervisord]
nodaemon=true
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
; إخراج php-fpm (وأخطاء Laravel عبر stderr) إلى سجلّ الحاوية → Railway
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/www/html/storage/logs/nginx.err
stdout_logfile=/var/www/html/storage/logs/nginx.out

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=2 --timeout=600 --queue=default,notifications
autostart=true
autorestart=true
numprocs=2
; مطلوب عند numprocs > 1: اسم فريد لكل نسخة (وإلا يرفض supervisord الإقلاع كلّياً)
process_name=%(program_name)s_%(process_num)02d
stderr_logfile=/var/www/html/storage/logs/queue.err
stdout_logfile=/var/www/html/storage/logs/queue.out
stopwaitsecs=600

[program:scheduler]
; يُشغِّل schedule:run كل دقيقة — بديل الـ cron داخل الحاوية
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run >> /var/www/html/storage/logs/scheduler.log 2>&1; sleep 60; done"
autostart=true
autorestart=true
stderr_logfile=/var/www/html/storage/logs/scheduler.err
stdout_logfile=/var/www/html/storage/logs/scheduler.out
