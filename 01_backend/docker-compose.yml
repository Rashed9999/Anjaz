version: "3.9"

# ═══════════════════════════════════════════════════════════
# أميال باي — إعداد الديمو الكامل
#
# يُشغِّل:
#   • amial-app   : Laravel API + Nginx + Queue + Scheduler
#   • amial-mysql : MySQL 8
#   • amial-ngrok : نفق عام للـ WhatsApp Webhook (اختياري)
#
# الاستخدام:
#   ./demo.sh start         ← تشغيل كامل (مع بيانات تجريبية)
#   ./demo.sh stop          ← إيقاف
#   ./demo.sh reset         ← إعادة ضبط كاملة
# ═══════════════════════════════════════════════════════════

services:

  # ── قاعدة البيانات ────────────────────────────────────
  amial-mysql:
    image: mysql:8.0
    container_name: amial-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: demo_local_only_root
      MYSQL_DATABASE:      amial_pay
      MYSQL_USER:          amial_user
      MYSQL_PASSWORD:      demo_local_only_pw
    volumes:
      - amial_mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "amial_user", "-pdemo_local_only_pw"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - amial-net

  # ── Laravel Backend ───────────────────────────────────
  amial-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amial-app
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/var/www/html/docker/entrypoint.sh"]
    env_file:
      - .env.demo
    environment:
      DB_HOST:     amial-mysql
      DB_PORT:     3306
      DB_DATABASE: amial_pay
      DB_USERNAME: amial_user
      DB_PASSWORD: demo_local_only_pw
      RUN_SEEDERS: "true"   # ← يُشغِّل البيانات التجريبية عند أوّل تشغيل
      # AMIAL-PROD-READINESS-001 — منفذُ الخروج من حاجز APP_DEBUG.
      # `.env.demo` يعمل بـ APP_DEBUG=true عن قصدٍ لبيئة التطوير المحلّيّة،
      # و`entrypoint.sh` يرفض الخدمةَ بها ما لم يُصرَّح هنا. **والتصريحُ
      # هنا لا هناك:** فالافتراضُ في الإنتاج يبقى مغلقاً.
      AMIAL_ALLOW_DEBUG: "true"
    volumes:
      - amial_storage:/var/www/html/storage/app
      - amial_logs:/var/www/html/storage/logs
    ports:
      - "8000:80"
    depends_on:
      amial-mysql:
        condition: service_healthy
    networks:
      - amial-net

  # ── ngrok: نفق WhatsApp Webhook ──────────────────────
  # يُشغَّل فقط عند إضافة NGROK_AUTHTOKEN في .env.demo
  amial-ngrok:
    image: ngrok/ngrok:latest
    container_name: amial-ngrok
    restart: unless-stopped
    command: http amial-app:80 --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"   # واجهة ngrok المحلّية (لعرض الرابط)
    depends_on:
      - amial-app
    networks:
      - amial-net
    profiles:
      - whatsapp   # يُشغَّل فقط بـ: docker compose --profile whatsapp up

networks:
  amial-net:
    driver: bridge

volumes:
  amial_mysql_data:
  amial_storage:
  amial_logs:
