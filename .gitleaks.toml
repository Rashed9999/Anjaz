# AMIAL — Gitleaks: كشف الأسرار المسرّبة (مفاتيح الدفع، توكنات، كلمات مرور)
# تشغيل: gitleaks detect --source . --config .gitleaks.toml
title = "Amial Pay gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "amial-payment-gateway-key"
description = "مفتاح بوابة دفع محتمل"
regex = '''(?i)(stripe|razorpay|paystack|paypal|xendit|iyzipay|mercadopago)[_-]?(secret|api|access|client)[_-]?(key|token|id)?\s*[:=]\s*['"][A-Za-z0-9_\-]{16,}['"]'''
tags = ["key", "payment"]

[[rules]]
id = "amial-pii-encryption-key"
description = "مفتاح تشفير PII"
regex = '''(?i)AMIAL_PII_(ENCRYPTION|BLIND_INDEX)_KEY\s*=\s*.{16,}'''
tags = ["key", "pii"]

[allowlist]
description = "ملفات مسموح بها (أمثلة/قوالب فقط)"
paths = [
    '''01_backend/\.env\.example''',
    '''.*\.md$''',
]
regexes = [
    '''YOUR_.*_HERE''',
    '''your-domain\.com''',
]
